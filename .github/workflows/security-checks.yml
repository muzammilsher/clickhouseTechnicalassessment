name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-terraform-gcp
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-firewall-scanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-dependency-audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Dependency audit & reporting
        run: |
          npm audit --json > npm-audit.json || true
          python3 audit.py npm-audit.json vulnerability-report.json
          python3 audit.py npm-audit.json vulnerability-report.csv

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: 02-cloud-security-check/Dockerfile.secure
